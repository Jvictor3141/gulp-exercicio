<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gulp</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main class="app">
        <h1>Calculadora simples</h1>

        <section class="calculator" id="calculator">
            <div class="calculator__row">
                <label for="calc-num1">Número 1</label>
                <input type="number" id="calc-num1" class="calculator__input" placeholder="Ex: 10">
            </div>

            <div class="calculator__row">
                <label for="calc-operation">Operação</label>
                <select id="calc-operation" class="calculator__select">
                    <option value="add">Somar (+)</option>
                    <option value="sub">Subtrair (-)</option>
                    <option value="mul">Multiplicar (×)</option>
                    <option value="div">Dividir (÷)</option>
                </select>
            </div>

            <div class="calculator__row">
                <label for="calc-num2">Número 2</label>
                <input type="number" id="calc-num2" class="calculator__input" placeholder="Ex: 5">
            </div>

            <div class="calculator__actions">
                <button type="button" id="calc-btn" class="calculator__button">Calcular</button>
            </div>

            <div class="calculator__result" id="calc-result" aria-live="polite">
                Informe os valores e clique em "Calcular".
            </div>
        </section>
    </main>

    <script src="./scripts/script.js"></script>
</body>
</html>
